name: X one-off correction (manual)
on: {workflow_dispatch: {}}
permissions: {contents: write}
concurrency: {group: wcn-update, cancel-in-progress: false}
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: git fetch --depth=1 origin data && git archive FETCH_HEAD | tar -x -C .
      - env:
          X_API_KEY: "${{ secrets.X_API_KEY }}"
          X_API_SECRET: "${{ secrets.X_API_SECRET }}"
          X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
          X_ACCESS_TOKEN_SECRET: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
        run: python x_fix.py
      - if: always()
        run: |
          rm -rf /tmp/state && mkdir -p /tmp/state/public && cp -r data /tmp/state/ && cp public/news.json /tmp/state/public/
          cd /tmp/state && git init -q -b data && git config user.name wcn-bot && git config user.email wcn-bot@users.noreply.github.com
          git add -A && git commit -qm "state $(date -u +%FT%TZ) (x_fix)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data
