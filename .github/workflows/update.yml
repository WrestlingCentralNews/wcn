name: Update news & deploy
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch:
    inputs:
      x_test_top: {description: 'Post the current top story to X once (test)', type: boolean, default: false}
  push: {branches: [main]}
permissions: {contents: write, pages: write, id-token: write, actions: write}
concurrency: {group: wcn-update, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.deploy.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Restore state from 'data' branch
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C . && echo "restored state: $(ls data public/news.json)"
          else echo "no data branch yet; starting fresh"; fi
      - name: Fetch, enrich, filter, cluster (60-day retention)
        id: agg
        env: {AI_API_KEY: "${{ secrets.AI_API_KEY }}"}
        run: python aggregator.py > agg.log 2>&1 || { tail -n 60 agg.log; exit 1; }; grep -vE '^( |\{|\})' agg.log | tail -n 30; cat data/stats.json data/llm_usage.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: {path: public, include-hidden-files: true}   # v4+ drops dotfiles by default; keep v3 behaviour
      - id: deploy
        uses: actions/deploy-pages@v5
      - name: Post new stories to X (never fails the run)
        continue-on-error: true
        env:
          X_POST_ENABLED: "${{ vars.X_POST_ENABLED }}"
          X_API_KEY: "${{ secrets.X_API_KEY }}"
          X_API_SECRET: "${{ secrets.X_API_SECRET }}"
          X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
          X_ACCESS_TOKEN_SECRET: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
        run: sleep 20; python x_poster.py ${{ github.event.inputs.x_test_top == 'true' && '--test-top' || '' }}
      - name: Live X thread per show (root + replies for results and segments; pin target -> data/x_pin.json; never fails the run)
        continue-on-error: true
        env:
          X_POST_ENABLED: "${{ vars.X_POST_ENABLED }}"
          AI_API_KEY: "${{ secrets.AI_API_KEY }}"
          X_API_KEY: "${{ secrets.X_API_KEY }}"
          X_API_SECRET: "${{ secrets.X_API_SECRET }}"
          X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
          X_ACCESS_TOKEN_SECRET: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
        run: python live_thread.py
      - name: Post confirmed live match results to X (link-free, never fails the run)
        continue-on-error: true
        env:
          X_POST_ENABLED: "${{ vars.X_POST_ENABLED }}"
          X_API_KEY: "${{ secrets.X_API_KEY }}"
          X_API_SECRET: "${{ secrets.X_API_SECRET }}"
          X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
          X_ACCESS_TOKEN_SECRET: "${{ secrets.X_ACCESS_TOKEN_SECRET }}"
        run: python live_x.py
      - name: Push breaking news via OneSignal (never fails the run)
        continue-on-error: true
        env:
          PUSH_ENABLED: "${{ vars.PUSH_ENABLED }}"
          ONESIGNAL_APP_ID: "${{ vars.ONESIGNAL_APP_ID }}"
          ONESIGNAL_REST_API_KEY: "${{ secrets.ONESIGNAL_REST_API_KEY }}"
        run: python push_sender.py
      - name: Ping IndexNow with new story URLs (never fails the run)
        continue-on-error: true
        run: python indexnow.py
      - name: Start the live-results driver if a show is on and no driver is running (never fails the run)
        continue-on-error: true
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: |
          if [ "$(python3 live.py --in-window 2>/dev/null)" = "yes" ]; then
            act=$(gh run list --workflow live.yml --limit 5 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
            [ "$act" = "0" ] && gh workflow run live.yml && echo "live driver started" || echo "live driver already running"
          fi
      - name: Save state to 'data' branch (single orphan commit, force-pushed)
        if: always() && steps.agg.outcome == 'success'
        run: |
          rm -rf /tmp/state && mkdir -p /tmp/state/public && cp -r data /tmp/state/ && cp public/news.json /tmp/state/public/
          cd /tmp/state && git init -q -b data && git config user.name wcn-bot && git config user.email wcn-bot@users.noreply.github.com
          git add -A && git commit -qm "state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data && exit 0; echo "push failed (attempt $i), retrying"; sleep $((i*10)); done; exit 1
